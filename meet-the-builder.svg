<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc">
<title id="title">Meet the builder</title><desc id="desc">Data Science at the University at Buffalo, expected May 2027. AI engineering, agentic systems and single-cell bioinformatics.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8194b0" stroke-opacity=".06"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#62ead5" stroke-width="1.4"/></marker><marker id="back" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#62ead5" stroke-width="1.4"/></marker></defs>
<rect x="1" y="1" width="1278" height="578" rx="24" fill="#0b1224" stroke="#2a3a50"/><rect width="1280" height="580" rx="24" fill="url(#grid)"/>
<text x="44" y="48" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#62ead5">PROFILE / 01</text><text x="44" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700" fill="#f3f6fc">Models. Agents. Cells.</text><text x="44" y="138" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#b7c5d9">Three interests connected by one habit: asking better questions.</text><rect x="44" y="172" width="1192" height="88" rx="16" fill="#111e32" stroke="#2a3a50"/><text x="66" y="207" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#62ead5">M.S. DATA SCIENCE</text><text x="66" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#f3f6fc">University at Buffalo, SUNY</text><text x="667" y="207" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#a6bdff">EXPECTED MAY 2027</text><text x="667" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#f3f6fc">B.E. in Information Technology</text><rect x="44" y="284" width="384" height="188" rx="16" fill="#111e32" stroke="#2a3a50"/><text x="66" y="318" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#62ead5">01</text><text x="66" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">AI engineering</text><text x="66" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Turn models into applications.</text><text x="66" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">LLM applications and RAG</text><text x="66" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Real-time voice interfaces</text><rect x="448" y="284" width="384" height="188" rx="16" fill="#111e32" stroke="#2a3a50"/><text x="470" y="318" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#a6bdff">02</text><text x="470" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Agentic systems</text><text x="470" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Give LLMs tools and workflows.</text><text x="470" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Agent orchestration</text><text x="470" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Tool use and function calling</text><rect x="852" y="284" width="384" height="188" rx="16" fill="#111e32" stroke="#2a3a50"/><text x="874" y="318" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#c7a0ff">03</text><text x="874" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Bioinformatics</text><text x="874" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Explore disease, cell by cell.</text><text x="874" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Single-cell RNA sequencing</text><text x="874" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#b7c5d9">Cell types and immune states</text><text x="44" y="512" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#62ead5">THE QUESTION BEHIND THE WORK</text><text x="44" y="545" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#f3f6fc">Why did a system make that decision? Why does a cell express that gene?</text></svg>