<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="706" viewBox="0 0 1280 706" role="img" aria-labelledby="title desc">
<title id="title">Single-cell research workflow</title><desc id="desc">Reanalyze healthy, keloid and systemic sclerosis skin data, with lupus datasets being explored. Quality control, integration, subtype annotation, and comparison with published markers. Focus on keratinocytes, fibroblasts and endothelial cells.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8194b0" stroke-opacity=".06"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#62ead5" stroke-width="1.4"/></marker><marker id="back" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#62ead5" stroke-width="1.4"/></marker></defs>
<rect x="1" y="1" width="1278" height="704" rx="24" fill="#0b1224" stroke="#2a3a50"/><rect width="1280" height="706" rx="24" fill="url(#grid)"/>
<text x="44" y="48" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#c7a0ff">EXPERIMENT / 02.2</text><text x="44" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="700" fill="#f3f6fc">Mapping immune dysregulation.</text><text x="44" y="139" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#b7c5d9">Compare cell populations and cell states across skin disease contexts.</text><rect x="44" y="172" width="194" height="46" rx="16" fill="#111e32" stroke="#62ead5"/><text x="60" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#62ead5">Healthy skin</text><rect x="252" y="172" width="170" height="46" rx="16" fill="#111e32" stroke="#a6bdff"/><text x="268" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#a6bdff">Keloid</text><rect x="436" y="172" width="262" height="46" rx="16" fill="#111e32" stroke="#c7a0ff"/><text x="452" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#c7a0ff">Systemic sclerosis</text><rect x="712" y="172" width="524" height="46" rx="16" fill="#111e32" stroke="#8fa3bd"/><text x="728" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8fa3bd">Lupus / exploring additional datasets</text><rect x="44" y="259" width="280" height="136" rx="16" fill="#111e32" stroke="#62ead5"/><text x="62" y="294" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#62ead5">01 / QC</text><text x="62" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">Reproduce published</text><text x="62" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">quality-control choices.</text><rect x="348" y="259" width="280" height="136" rx="16" fill="#111e32" stroke="#a6bdff"/><text x="366" y="294" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#a6bdff">02 / INTEGRATE</text><text x="366" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">Seurat + Harmony</text><text x="366" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">Clustering and visualization</text><rect x="652" y="259" width="280" height="136" rx="16" fill="#111e32" stroke="#c7a0ff"/><text x="670" y="294" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#c7a0ff">03 / ANNOTATE</text><text x="670" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">Differential expression</text><text x="670" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">and cell-type markers.</text><rect x="956" y="259" width="280" height="136" rx="16" fill="#111e32" stroke="#62ead5"/><text x="974" y="294" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#62ead5">04 / COMPARE</text><text x="974" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">Check published markers</text><text x="974" y="361" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#b7c5d9">and unexpected expression.</text><path d="M327 326 L344 326" fill="none" stroke="#62ead5" stroke-width="2" marker-end="url(#arrow)"/><path d="M631 326 L648 326" fill="none" stroke="#62ead5" stroke-width="2" marker-end="url(#arrow)"/><path d="M935 326 L952 326" fill="none" stroke="#62ead5" stroke-width="2" marker-end="url(#arrow)"/><text x="44" y="440" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#c7a0ff">SUBTYPE INVESTIGATIONS</text><rect x="44" y="461" width="384" height="58" rx="16" fill="#111e32" stroke="#2a3a50"/><text x="64" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#f3f6fc">Keratinocytes</text><rect x="448" y="461" width="384" height="58" rx="16" fill="#111e32" stroke="#2a3a50"/><text x="468" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#f3f6fc">Fibroblasts</text><rect x="852" y="461" width="384" height="58" rx="16" fill="#111e32" stroke="#2a3a50"/><text x="872" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#f3f6fc">Endothelial cells</text><text x="44" y="563" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#62ead5">RESEARCH THEME</text><text x="44" y="596" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#f3f6fc">Characterizing cellular phenotypes associated with localized</text><text x="44" y="626" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#f3f6fc">and systemic immune dysregulation.</text><text x="44" y="675" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#8fa3bd">R  /  SEURAT  /  HARMONY  /  scRNA-seq  /  DIFFERENTIAL EXPRESSION  /  MARKER VALIDATION</text></svg>