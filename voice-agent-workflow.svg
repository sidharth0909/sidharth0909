<title id="title">Voice-agent workflow</title><desc id="desc">Bidirectional call audio connects the caller, Twilio, the Python WebSocket bridge exposed through ngrok, and Deepgram Voice Agent. Python handles prototype pharmacy function calls and results.</desc>
